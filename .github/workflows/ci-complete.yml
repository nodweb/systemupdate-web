name: Complete CI Pipeline

on: [push, pull_request]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          pip install -r SystemUpdate-Web/backend/requirements.txt
      - name: Run Ruff
        run: ruff check SystemUpdate-Web/backend
      - name: Run tests with coverage
        working-directory: SystemUpdate-Web/backend
        run: pytest --maxfail=1 --disable-warnings -q --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and lint
        working-directory: SystemUpdate-Web/frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run type-check --if-present
          npm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit jq
      - name: Run Bandit Security Scan
        run: |
          bandit -r SystemUpdate-Web/backend/app -f json -o bandit-report.json || true
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json
      - name: Fail on HIGH severity findings
        shell: bash
        run: |
          set -e
          if [ -f bandit-report.json ]; then
            CRITICAL=$(jq '.results | map(select(.issue_severity == "HIGH")) | length' bandit-report.json)
            echo "HIGH severity findings: $CRITICAL"
            if [ "$CRITICAL" -gt 0 ]; then
              echo "Failing due to HIGH severity Bandit issues"
              exit 1
            fi
          fi
